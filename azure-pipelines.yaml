pool:
  vmImage: ubuntu-latest

variables:
  publishDir: '$(Build.ArtifactStagingDirectory)/api-publish'
  zipPath: '$(Build.ArtifactStagingDirectory)/api.zip'

steps:
  - checkout: self
    submodules: true

  ##### FRONTEND: STATIC WEB APP #####
  - task: AzureStaticWebApp@0
    displayName: 'Build & Deploy SWA'
    inputs:
      app_location: 'Client'
      app_build_command: 'dotnet publish -c Release'
      output_location: 'wwwroot'

      api_location: 'Api'
      api_build_command: 'dotnet publish -c Release'

      skip_app_build: false
      skip_api_build: false
      config_file_location: 'Client'

      production_branch: 'element'
      azure_static_web_apps_api_token: $(deployment_token)


  ##### BACKEND: .NET 9 ISOLATED FUNCTION APP #####

  # 1. Publish the .NET 9 isolated worker project
  - task: DotNetCoreCLI@2
    displayName: 'Publish Azure Function (.NET 9 isolated)'
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: 'HubFunctions/HubFunctions.csproj'        # ✅ Your backend project
      arguments: '--configuration Release --output $(publishDir)'
      zipAfterPublish: false

  # 2. Create ZIP for deployment
  - task: ArchiveFiles@2
    displayName: 'Zip function output'
    inputs:
      rootFolderOrFile: '$(publishDir)'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(zipPath)'
      replaceExistingArchive: true

  # 3. Deploy ZIP directly to Azure Function App
  - task: AzureCLI@2
    displayName: 'Deploy Function App'
    inputs:
      azureSubscription: 'Bucket2'   # ✅ Fix this
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az functionapp deployment source config-zip \
          --name DigitalHomeHubFunctionsv2 \
          --resource-group rg-bucket2 \     # ✅ Fix this
          --src $(zipPath)